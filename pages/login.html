<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="shortcut icon" href="../img/favicon.svg" type="image/x-icon">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/formularios.css">
    <title>FitMaster | Entrar</title>
</head>

<body class="bg-primary-color formulario ">
    <main class="container vh-100 d-flex justify-content-center align-items-center p-0">
        <section id="entrar" class=" bg-opacity-90 text-white p-4 rounded-4 text-center p-lg-5">
            <img src="../img/logo.png" width="200" alt="Logo FitMaster" class="">
            <h2 class="fw-bold text-uppercase p-3">Entrar</h2>
            <form action="" class="d-flex flex-column gap-3">
                <div class="d-flex flex-column w-100 align-items-start">
                    <label for="email">E-mail</label>
                    <input class="bg-secondary-color border-0 p-2 rounded-2 text-white w-100" type="email" name="email"
                        id="email" placeholder="Digite seu e-mail">
                </div>
                <div class="d-flex flex-column w-100 align-items-start">
                    <label for="senha">Senha</label>
                    <input type="password" name="senha"
                        class="bg-secondary-color border-0 p-2 rounded-2 text-white w-100" id="senha"
                        placeholder="Digite sua senha">
                </div>
                <p class="m-0">Ainda não é nosso aluno? <a href="matricule-se.html" class="color-primary">Matricule-se</a></p>
                <div class="row g-2">
                    <div class="col-6">
                        <a href="/index.html" class="btn-secondary d-block w-100">Voltar</a>
                    </div>
                    <div class="col-6">
                        <a href="dashboard.html" class="btn-primary d-block w-100">Entrar</a>
                    </div>
                </div>
            </form>
        </section>
    </main>
</body>

</html>
